name: gitleaks

# tonakai-coco は個人アカウント。gitleaks-action v3 の README と EULA では
# Personal Account のリポジトリに GITLEAKS_LICENSE は不要。
on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          # SARIF には値そのものが入り得る。公開リポジトリでは成果物に残さない。
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # 検出の通知はジョブの失敗で足りる。PR へレビューコメントは付けない。
          GITLEAKS_ENABLE_COMMENTS: "false"
